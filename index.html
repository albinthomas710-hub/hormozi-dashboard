    :root{
      --bg: #09090b; --surface: #18181b; --surface-hover: #27272a; --border: #3f3f46;

    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;padding:30px;}
    .container{max-width:1280px;margin:0 auto;}
    header{text-align:center;padding-bottom:28px;border-bottom:1px solid var(--border);margin-bottom:32px;}
    header h1{font-size:2.6rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;}
    header h1 span{color:var(--accent-red);}
    header p{color:var(--text-dim);margin-top:8px;font-size:0.95rem;}
    .nb-btn{display:inline-block;margin-top:18px;padding:13px 26px;background:var(--accent-yellow);color:#000;text-decoration:none;font-weight:700;font-size:0.95rem;border-radius:6px;transition:opacity .2s;}
    .nb-btn:hover{opacity:.85;}
    
    .grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;}
    .vault, .pad-panel{background:var(--surface);border-radius:12px;padding:24px;}
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    .tab { background: transparent; color: var(--text-dim); border: none; font-size: 1.2rem; font-family: 'Space Grotesk', sans-serif; font-weight: 700; cursor: pointer; padding: 5px 10px; transition: all 0.2s ease; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent-red); border-bottom: 3px solid var(--accent-red); }

    .category{margin-bottom:24px;}
    .category-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .category-header span{font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);}
    
    .book-item{background:var(--surface-hover);border-radius:7px;padding:12px 16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:background .15s;}
    .book-item:hover{background:#3f3f46;}
    .book-item a{color:var(--text);text-decoration:none;font-weight:600;font-size:0.875rem;flex:1;line-height:1.4;}
    .book-item a:hover{color:var(--accent-yellow);}
    .ext-tag{font-size:0.7rem;color:#71717a;margin-left:6px;text-transform:uppercase;}
    
    select{background:var(--surface);color:var(--text-dim);border:1px solid var(--border);padding:5px 8px;border-radius:5px;font-size:0.75rem;cursor:pointer;flex-shrink:0;}
    select:focus{outline:none;border-color:var(--accent-red);}

    .pad-panel{display:flex;flex-direction:column;}
    .pad-title{font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent-red);margin-bottom:16px;}
    textarea{flex:1;min-height:500px;background:#111;color:#fff;border:1px solid var(--border);padding:16px;font-family:inherit;font-size:0.9rem;border-radius:8px;resize:vertical;line-height:1.7;}
    textarea:focus{outline:none;border-color:var(--accent-red);}
    .autosave{font-size:0.7rem;color:#71717a;margin-top:8px;text-align:right;}
    
    @media(max-width:900px){.grid{grid-template-columns:1fr;}}
  
    .add-form { display: flex; gap: 10px; margin-bottom: 20px; background: #222; padding: 15px; border-radius: 8px; flex-wrap: wrap; }
    .add-form input, .add-form select { background: #111; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 4px; flex: 1; min-width: 150px; }
    .add-form button { background: var(--accent-red); color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .add-form button:hover { opacity: 0.8; }
    .add-form-title { width: 100%; color: var(--accent-yellow); font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
</style>

  document.getElementById('tab-' + tabId).classList.add('active');
  document.getElementById('content-' + tabId).style.display = 'block';
}

var statuses = JSON.parse(localStorage.getItem('hStatuses') || '{}');

window.saveStatus = function(f, v) {
  statuses[f] = v;
  localStorage.setItem('hStatuses', JSON.stringify(statuses));
};

function createSelectHtml(id, st) {
  var safeId = id.replace(/'/g, "&apos;");
  return `<select onchange="saveStatus('${safeId}', this.value)">
    <option value="wishlist" ${st==='wishlist'?'selected':''}>Wishlist</option>
    <option value="reading" ${st==='reading'?'selected':''}>📖 Reading</option>
    <option value="finished" ${st==='finished'?'selected':''}>✅ Finished</option>
  </select>`;
}

Object.keys(hCategories).forEach(function(catId) {
  var container = document.getElementById(catId);
  if(!container) return;
  hCategories[catId].forEach(function(item) {
    var st = statuses[item.file] || 'wishlist';
    var ext = item.file.split('.').pop().toUpperCase();
    var div = document.createElement('div');
    div.className = 'book-item';
    var href = item.url ? item.url : 'Resources/' + encodeURIComponent(item.file);
    var extLabel = item.url ? 'LINK' : ext;
    
    div.innerHTML = `<a href="${href}" target="_blank">${item.label}<span class="ext-tag">${extLabel}</span></a>` + createSelectHtml(item.file, st);
    
    container.appendChild(div);
  });
});

function saveMentors() {
    localStorage.setItem('mentorsV3', JSON.stringify(mentorsCategories));
}

function renderMentors() {
    var container = document.getElementById('mentors-dynamic-container');
    if (!container) return;
    container.innerHTML = '';
    
    var selectCat = document.getElementById('add-book-cat');
    if (selectCat) selectCat.innerHTML = '';
    
    Object.keys(mentorsCategories).forEach(function(catName) {
        // catName is now the actual pretty name like "Finance & Money"
        if (selectCat) {
            var opt = document.createElement('option');
            opt.value = catName;
            opt.textContent = catName;
            selectCat.appendChild(opt);
        }
        
        var safeId = catName.toLowerCase().replace(/[^a-z0-9]/g, '');
        
        var catDiv = document.createElement('div');
        catDiv.className = 'category';
        catDiv.innerHTML = `<div class="category-header"><span>📚 ${catName.toUpperCase()}</span></div><div id="dynamic-${safeId}"></div>`;
        container.appendChild(catDiv);
        
        var listContainer = document.getElementById(`dynamic-${safeId}`);
        
        mentorsCategories[catName].forEach(function(item) {
            var id = item.label; 
            var st = statuses[id] || 'wishlist';
            var div = document.createElement('div');
            div.className = 'book-item';
            div.innerHTML = `<a class="item-link" style="pointer-events: none; cursor: default;">${item.label}</a>` + createSelectHtml(id, st);
            listContainer.appendChild(div);
        });
    });
}

window.addCategory = function() {
    var name = document.getElementById('new-cat-name').value.trim();
    if (!name) return;
    // Use the raw typed name as the key!
    if (!mentorsCategories[name]) {
        mentorsCategories[name] = [];
        saveMentors();
        renderMentors();
    }
    document.getElementById('new-cat-name').value = '';
};

window.addBook = function() {
    var catName = document.getElementById('add-book-cat').value;
    var title = document.getElementById('new-book-title').value.trim();
    var author = document.getElementById('new-book-author').value.trim();
    if (!title || !catName) return;
    
    var label = author ? title + " - by " + author : title;
    mentorsCategories[catName].push({label: label});
    saveMentors();
    renderMentors();
    
    document.getElementById('new-book-title').value = '';
    document.getElementById('new-book-author').value = '';
};
